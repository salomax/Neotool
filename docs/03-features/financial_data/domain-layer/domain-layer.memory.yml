meta:
  module: financial_data
  feature_name: Domain Layer Implementation for Financial Data Models
  feature_slug: domain-layer

summary: |
  Implement domain layer following Domain-Driven Design (DDD) patterns for financial_data service.
  Provides type-safe domain objects that separate business logic from persistence layer.
  
  Scope: Core tables only (institution, bank_report, bank_report_data, parent_institution).
  Internal tables (ifdata_extract_task, ifdata_load_control, ifdata_raw) are excluded for now.

business_rules:
  institution:
    primary_key: bacenCodInst (String, TEXT in DB, preserves leading zeros)
    required_fields:
      - bacenCodInst: String (not blank, primary key)
      - anoMesRef: String (exactly 6 characters, format YYYYMM)
      - sourceHash: String (exactly 64 characters, SHA-256 hex)
    optional_fields:
      - nomeInstituicao: String?
      - situacao: Char? (single character, typically 'A' for active)
      - segmentoTb: String?
      - atividade: String?
      - tipoControle: String? (TC: '1'=Public, '2'=Private national, '3'=Private foreign control)
      - uf: String? (2 characters, state code)
      - municipio: String?
      - codConglomeradoFinanceiro: String?
      - codConglomeradoPrudencial: String?
      - cnpjInstituicaoLider: String?
      - tipoConsolidadoBancario: String? (TCB: b1, B2, B3S, B3C, b4, N1, n2, N4)
      - tipoConsolidacao: Char? (TD: 'I'=Independent, 'C'=Conglomerate)
    validation_rules:
      - sourceHash must be exactly 64 characters (SHA-256 hex)
      - anoMesRef must be exactly 6 characters (YYYYMM format)
      - situacao must be single character if provided
      - tipoConsolidacao must be 'I' or 'C' if provided
      - tipoControle must be '1', '2', or '3' if provided
    audit_fields:
      - createdAt: Instant (default: Instant.now())
      - updatedAt: Instant (default: Instant.now())
    conversion:
      - toEntity(): Uses bacenCodInst as primary key (String, not UUID)
      - Package: io.github.salomax.neotool.financial_data.domain

  bank_report:
    primary_key: id (UUID?, nullable for new entities, DB generates UUID v7)
    natural_key:
      - codInst: String (required)
      - anoMes: String (required, 6 characters, YYYYMM format)
      - nomeRelatorio: String (required)
      - numeroRelatorio: String (required)
      - tipoInstituicao: Int (required, must be 1-4)
    required_fields:
      - codInst: String
      - anoMes: String (6 characters, YYYYMM format)
      - nomeRelatorio: String
      - numeroRelatorio: String
      - tipoInstituicao: Int (1-4, consolidation perspective)
    validation_rules:
      - All natural key fields are required
      - tipoInstituicao must be between 1 and 4 (inclusive)
      - Natural key (codInst, anoMes, nomeRelatorio, numeroRelatorio, tipoInstituicao) must be unique
    audit_fields:
      - createdAt: Instant (default: Instant.now())
      - updatedAt: Instant (default: Instant.now())
    conversion:
      - toEntity(): Pass null for id (DB generates UUID v7)
      - Package: io.github.salomax.neotool.financial_data.domain
    relationships:
      - bankReportData: One-to-many (BankReport has many BankReportData)

  bank_report_data:
    primary_key: id (UUID?, nullable for new entities, DB generates UUID v7)
    required_fields:
      - bankReportId: UUID (foreign key to BankReport, required)
    optional_fields:
      - grupo: String?
      - conta: String?
      - nomeColuna: String?
      - descricaoColuna: String?
      - saldo: java.math.BigDecimal? (nullable, can be currency or percentage)
    validation_rules:
      - bankReportId must be a valid UUID
      - bankReportId is required (foreign key constraint)
    audit_fields:
      - createdAt: Instant (default: Instant.now())
      - updatedAt: Instant (default: Instant.now())
    conversion:
      - toEntity(): Pass null for id (DB generates UUID v7)
      - Package: io.github.salomax.neotool.financial_data.domain
    relationships:
      - bankReport: Many-to-one (BankReportData belongs to BankReport)

  institution_enhancement:
    primary_key: parentCnpj (String, root CNPJ)
    required_fields:
      - parentCnpj: String (not blank, primary key)
    optional_fields:
      - legalName: String? (from CNPJ data provider company.name)
      - tradeName: String? (from CNPJ data provider alias)
      - emailDomain: String? (extracted from CNPJ data provider emails)
      - website: String? (from CNPJ data provider or website resolution)
      - logoStorageKey: String? (from asset management service, TODO: service integration)
      - socialNetwork: JsonNode? (JSONB, social network links: linkedin, instagram, facebook, twitter, x)
      - receitaData: JsonNode? (JSONB, full CNPJ data provider response from Receita.gov.br)
    validation_rules:
      - parentCnpj must not be blank
      - socialNetwork must be valid JSON if provided
      - receitaData must be valid JSON if provided
    business_rules:
      - One enhancement per parent CNPJ
      - Multiple institutions can share the same parentCnpj (if they have the same cnpj_instituicao_lider)
      - If institution has no parent, parentCnpj is constructed from bacen_cod_inst
    audit_fields:
      - createdAt: Instant (default: Instant.now())
      - updatedAt: Instant (default: Instant.now())
    conversion:
      - toEntity(): Uses parentCnpj as primary key (String, not UUID)
      - Package: io.github.salomax.neotool.financial_data.domain

implementation_notes:
  domain_pattern:
    - Follow pattern from docs/04-patterns/backend-patterns/domain-model-pattern.md
    - Domain objects use nullable IDs (UUID? or String?)
    - toEntity() method for domain → entity conversion
    - UUID v7: Pass null for new entities, let DB generate
    - String keys: Pass directly
    - All domain objects are data classes in Kotlin
    - Use Instant for timestamps (not LocalDateTime)
    - Use java.math.BigDecimal for numeric values (saldo)

  package_structure:
    base_package: io.github.salomax.neotool.financial_data.domain
    files:
      - Institution.kt
      - BankReport.kt
      - BankReportData.kt
      - InstitutionEnhancement.kt

  validation_approach:
    - Use init blocks in data classes for validation
    - Use require() for validation checks
    - Validation errors should be descriptive
    - Follow patterns from security service domain objects

  conversion_patterns:
    uuid_v7:
      - Domain object: id: UUID? = null (nullable for new entities)
      - toEntity(): Pass id directly (null for new, existing UUID for updates)
      - Database generates UUID v7 on insert when id is null
    string_key:
      - Domain object: bacenCodInst: String (required, not nullable)
      - toEntity(): Pass bacenCodInst as primary key
      - No database generation needed

  field_mappings:
    database_to_kotlin:
      - snake_case → camelCase (e.g., ano_mes_ref → anoMesRef)
      - TEXT → String
      - CHAR(n) → String or Char (depending on length)
      - INTEGER → Int
      - NUMERIC → java.math.BigDecimal
      - UUID → java.util.UUID
      - TIMESTAMPTZ → java.time.Instant
      - JSONB → com.fasterxml.jackson.databind.JsonNode (or similar)

  consolidation_types:
    tipo_consolidado_bancario_tcb:
      values: ["b1", "B2", "B3S", "B3C", "b4", "N1", "n2", "N4"]
      meanings:
        - b1: Commercial bank/Caixas
        - B2: Multiple/Investment
        - B3S: Singular cooperative
        - B3C: Central cooperative
        - b4: Development
        - N1: Non-bank credit
        - n2: Non-bank capital markets
        - N4: Payment institutions
    tipo_consolidacao_td:
      values: ["I", "C"]
      meanings:
        - I: Independent institution
        - C: Conglomerate
    tipo_controle_tc:
      values: ["1", "2", "3"]
      meanings:
        - "1": Public
        - "2": Private national
        - "3": Private foreign control

  reference_documents:
    - docs/04-patterns/backend-patterns/domain-model-pattern.md
    - docs/04-patterns/backend-patterns/entity-pattern.md
    - docs/04-patterns/backend-patterns/domain-entity-conversion.md
    - docs/04-patterns/backend-patterns/uuid-v7-pattern.md
    - service/kotlin/security/src/main/kotlin/io/github/salomax/neotool/security/domain/rbac/ (examples)

  next_steps:
    - After domain layer implementation, proceed to Backend Repository Phase
    - Implement JPA entities with toDomain() methods
    - Implement repositories
    - Add unit tests for domain objects (90%+ coverage)

