meta:
  module: financial_data
  feature_name: Domain Layer Implementation for Financial Data Models
  feature_slug: domain-layer
  reference_spec: docs/06-workflows/spec-context-strategy.md

phases:
  domain:
    description: |
      Implement domain objects following DDD patterns. Domain objects provide type-safe
      business logic representation separated from persistence layer.
    
    context_loading:
      essential:
        - docs/MANIFEST.md
        - docs/00-overview/architecture-overview.md
        - docs/02-domain/glossary.md
      feature:
        - docs/03-features/financial_data/domain-layer/domain-layer.feature
        - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
      phase_specific:
        - docs/04-patterns/backend-patterns/domain-model-pattern.md
        - docs/04-patterns/backend-patterns/uuid-v7-pattern.md
        - docs/05-standards/database-standards/schema-standards.md
        - service/kotlin/security/src/main/kotlin/io/github/salomax/neotool/security/domain/rbac/User.kt (example)
        - service/kotlin/security/src/main/kotlin/io/github/salomax/neotool/security/domain/rbac/Group.kt (example)
    
    tasks:
      - id: domain-1
        description: Implement Institution domain object
        details: |
          Create Institution.kt in package io.github.salomax.neotool.financial_data.domain
          - Primary key: bacenCodInst (String, not nullable)
          - Required fields: anoMesRef (6 chars, YYYYMM), sourceHash (64 chars)
          - Optional fields: nomeInstituicao, situacao, segmentoTb, atividade, tipoControle,
            uf, municipio, codConglomeradoFinanceiro, codConglomeradoPrudencial,
            cnpjInstituicaoLider, tipoConsolidadoBancario, tipoConsolidacao
          - Validation: sourceHash must be 64 chars, anoMesRef must be 6 chars,
            situacao must be single char, tipoConsolidacao must be 'I' or 'C',
            tipoControle must be '1', '2', or '3'
          - toEntity() method: Pass bacenCodInst as primary key
          - Use Instant for timestamps
        files:
          - service/kotlin/financial_data/src/main/kotlin/io/github/salomax/neotool/financial_data/domain/Institution.kt
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
          - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
        
      - id: domain-2
        description: Implement BankReport domain object
        details: |
          Create BankReport.kt in package io.github.salomax.neotool.financial_data.domain
          - Primary key: id (UUID?, nullable for new entities, DB generates UUID v7)
          - Natural key: (codInst, anoMes, nomeRelatorio, numeroRelatorio, tipoInstituicao)
          - Required fields: all natural key fields
          - Validation: tipoInstituicao must be 1-4, all natural key fields required
          - toEntity() method: Pass null for id (DB generates UUID v7)
          - Use Instant for timestamps
        files:
          - service/kotlin/financial_data/src/main/kotlin/io/github/salomax/neotool/financial_data/domain/BankReport.kt
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
          - docs/04-patterns/backend-patterns/uuid-v7-pattern.md
          - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
        
      - id: domain-3
        description: Implement BankReportData domain object
        details: |
          Create BankReportData.kt in package io.github.salomax.neotool.financial_data.domain
          - Primary key: id (UUID?, nullable for new entities, DB generates UUID v7)
          - Required fields: bankReportId (UUID, foreign key)
          - Optional fields: grupo, conta, nomeColuna, descricaoColuna, saldo (BigDecimal?)
          - Validation: bankReportId must be valid UUID, required
          - toEntity() method: Pass null for id (DB generates UUID v7)
          - Use Instant for timestamps
          - Use java.math.BigDecimal for saldo
        files:
          - service/kotlin/financial_data/src/main/kotlin/io/github/salomax/neotool/financial_data/domain/BankReportData.kt
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
          - docs/04-patterns/backend-patterns/uuid-v7-pattern.md
          - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
        
      - id: domain-4
        description: Implement InstitutionEnhancement domain object
        details: |
          Create InstitutionEnhancement.kt in package io.github.salomax.neotool.financial_data.domain
          - Primary key: parentCnpj (String, not nullable)
          - Required fields: parentCnpj (not blank)
          - Optional fields: legalName, tradeName, emailDomain, website, logoStorageKey,
            socialNetwork (JsonNode?), receitaData (JsonNode?)
          - Validation: parentCnpj must not be blank, socialNetwork and receitaData must be valid JSON if provided
          - toEntity() method: Pass parentCnpj as primary key
          - Use Instant for timestamps
          - Use JsonNode (or similar) for JSONB fields
        files:
          - service/kotlin/financial_data/src/main/kotlin/io/github/salomax/neotool/financial_data/domain/InstitutionEnhancement.kt
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
          - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
        
      - id: domain-5
        description: Review domain objects for spec compliance
        details: |
          Review all domain objects against:
          - Domain model pattern compliance
          - Validation rules from memory.yml
          - Package structure correctness
          - toEntity() method implementation
          - Field naming (camelCase)
          - Type usage (Instant, BigDecimal, UUID, JsonNode)
        validation:
          - All domain objects follow domain-model-pattern.md
          - All validations from memory.yml are implemented
          - Package structure is correct
          - toEntity() methods are implemented correctly
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
          - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
          - docs/11-validation/code-review-checklist.md

  backend_repository:
    description: |
      Implement JPA entities and repositories. This phase creates the persistence layer
      that maps to database tables and provides toDomain() methods for entity-to-domain conversion.
      Note: This phase is optional for now - can be implemented after domain layer is complete.
    
    context_loading:
      essential:
        - docs/MANIFEST.md
        - docs/00-overview/architecture-overview.md
        - docs/02-domain/glossary.md
      feature:
        - docs/03-features/financial_data/domain-layer/domain-layer.feature
        - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
      phase_specific:
        - docs/04-patterns/backend-patterns/entity-pattern.md
        - docs/04-patterns/backend-patterns/repository-pattern.md
        - docs/04-patterns/backend-patterns/domain-entity-conversion.md
        - docs/05-standards/database-standards/schema-standards.md
    
    tasks:
      - id: repo-1
        description: Implement JPA Entities
        details: |
          Create JPA entities for Institution, BankReport, BankReportData, InstitutionEnhancement
          - Follow entity-pattern.md structure
          - Use @Table(name = "...", schema = "financial_data")
          - Implement toDomain() methods
          - Use @Version for optimistic locking
          - All properties must be open var
        note: This phase can be implemented later after domain layer is complete
        spec_references:
          - docs/04-patterns/backend-patterns/entity-pattern.md
          - docs/04-patterns/backend-patterns/domain-entity-conversion.md
        
      - id: repo-2
        description: Implement Repositories
        details: |
          Create repositories for each entity
          - Follow repository-pattern.md
          - Extend JpaRepository<EntityType, IDType>
          - Add query methods as needed
        note: This phase can be implemented later after domain layer is complete
        spec_references:
          - docs/04-patterns/backend-patterns/repository-pattern.md

  testing:
    description: |
      Write unit tests for domain objects. Tests should cover validation, conversion,
      and business rules. Target 90%+ code coverage.
    
    context_loading:
      essential:
        - docs/MANIFEST.md
      feature:
        - docs/03-features/financial_data/domain-layer/domain-layer.feature
        - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
      phase_specific:
        - docs/05-standards/testing-standards/unit-test-standards.md
        - docs/04-patterns/backend-patterns/testing-pattern.md
    
    tasks:
      - id: test-1
        description: Map Gherkin scenarios to unit tests
        details: |
          Review domain-layer.feature and map each scenario to unit tests
          - Happy path scenarios → positive test cases
          - Validation scenarios → negative test cases
          - Conversion scenarios → conversion test cases
        spec_references:
          - docs/03-features/financial_data/domain-layer/domain-layer.feature
          - docs/05-standards/testing-standards/unit-test-standards.md
        
      - id: test-2
        description: Write unit tests for Institution domain object
        details: |
          Test Institution domain object:
          - Creation with required fields
          - Creation with optional fields
          - Validation failures (missing required fields, invalid formats)
          - toEntity() conversion
          - Consolidation type validations
        files:
          - service/kotlin/financial_data/src/test/kotlin/io/github/salomax/neotool/financial_data/domain/InstitutionTest.kt
        spec_references:
          - docs/05-standards/testing-standards/unit-test-standards.md
          - docs/04-patterns/backend-patterns/testing-pattern.md
        
      - id: test-3
        description: Write unit tests for BankReport domain object
        details: |
          Test BankReport domain object:
          - Creation with required fields
          - Validation failures (missing natural key fields, invalid tipoInstituicao)
          - toEntity() conversion with null ID (UUID v7)
          - Natural key uniqueness validation
        files:
          - service/kotlin/financial_data/src/test/kotlin/io/github/salomax/neotool/financial_data/domain/BankReportTest.kt
        spec_references:
          - docs/05-standards/testing-standards/unit-test-standards.md
          - docs/04-patterns/backend-patterns/testing-pattern.md
        
      - id: test-4
        description: Write unit tests for BankReportData domain object
        details: |
          Test BankReportData domain object:
          - Creation with required fields
          - Creation with nullable saldo
          - Validation failures (missing bankReportId, invalid UUID)
          - toEntity() conversion
        files:
          - service/kotlin/financial_data/src/test/kotlin/io/github/salomax/neotool/financial_data/domain/BankReportDataTest.kt
        spec_references:
          - docs/05-standards/testing-standards/unit-test-standards.md
          - docs/04-patterns/backend-patterns/testing-pattern.md
        
      - id: test-5
        description: Write unit tests for InstitutionEnhancement domain object
        details: |
          Test InstitutionEnhancement domain object:
          - Creation with required fields
          - Creation with optional fields (including JSONB)
          - Validation failures (blank parentCnpj, invalid JSON)
          - toEntity() conversion
        files:
          - service/kotlin/financial_data/src/test/kotlin/io/github/salomax/neotool/financial_data/domain/InstitutionEnhancementTest.kt
        spec_references:
          - docs/05-standards/testing-standards/unit-test-standards.md
          - docs/04-patterns/backend-patterns/testing-pattern.md
        
      - id: test-6
        description: Verify test coverage meets 90%+ requirement
        details: |
          Run test coverage analysis
          - Ensure 90%+ code coverage for domain objects
          - All branches tested
          - All validation paths tested
        spec_references:
          - docs/05-standards/testing-standards/unit-test-standards.md

  quality_assurance:
    description: |
      Run linting, checklists, and verify spec compliance before completion.
    
    context_loading:
      essential:
        - docs/MANIFEST.md
      feature:
        - docs/03-features/financial_data/domain-layer/domain-layer.feature
        - docs/03-features/financial_data/domain-layer/domain-layer.memory.yml
      phase_specific:
        - docs/05-standards/coding-standards/linting-standards.md
        - docs/11-validation/code-review-checklist.md
        - docs/11-validation/feature-checklist.md
    
    tasks:
      - id: qa-1
        description: Run linter and fix issues
        details: |
          Run Kotlin linter (ktlint) and fix all issues
          - ./gradlew ktlintCheck
          - Fix all reported issues
        spec_references:
          - docs/05-standards/coding-standards/linting-standards.md
        
      - id: qa-2
        description: Complete code review checklist
        details: |
          Review code against code-review-checklist.md
          - Spec compliance
          - Pattern adherence
          - Type safety
        spec_references:
          - docs/11-validation/code-review-checklist.md
        
      - id: qa-3
        description: Complete feature checklist
        details: |
          Verify feature-checklist.md requirements
          - All scenarios implemented
          - All business rules enforced
          - Documentation complete
        spec_references:
          - docs/11-validation/feature-checklist.md

implementation_order:
  - domain (required, first phase)
  - testing (required, after domain)
  - quality_assurance (required, before completion)
  - backend_repository (optional, can be done later)

notes: |
  This feature focuses on domain layer implementation only. Backend repository phase
  (entities and repositories) can be implemented in a separate feature or later.
  
  The domain layer provides:
  - Type-safe domain objects
  - Business logic validation
  - Separation from persistence layer
  - Foundation for service layer implementation

