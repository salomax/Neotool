meta:
  module: financial_data
  feature_name: BACEN IFData Ingestion
  feature_slug: bacen-ifdata-ingestion
  implementation_language: python
  workflow_engine: prefect
  migration_tool: pyway

phases:
  domain:
    name: Domain Phase (Python Migrations)
    description: Create database schema and tables using pyway migrations
    status: pending
    context_specs:
      - docs/05-standards/database-standards/schema-standards.md
      - docs/04-patterns/backend-patterns/domain-model-pattern.md
      - docs/09-adr/0005-postgresql-database.md
    tasks:
      - id: domain-001
        name: Set up pyway migration structure
        description: |
          Create migration directory structure for pyway:
          - workflow/financial_data/migrations/
          - Configure pyway settings (pyway.conf or pyway.yaml)
          - Set up migration naming convention
        files:
          - workflow/financial_data/migrations/.gitkeep
          - workflow/financial_data/pyway.conf (or pyway.yaml)
        spec_references:
          - docs/05-standards/database-standards/schema-standards.md
        status: pending
        
      - id: domain-002
        name: Create financial_data schema migration
        description: |
          Create initial migration to create financial_data schema:
          - V1_1__create_financial_data_schema.sql
          - Use IF NOT EXISTS for idempotency
          - Set search_path appropriately
        files:
          - workflow/financial_data/migrations/V1_1__create_financial_data_schema.sql
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
        status: pending
        
      - id: domain-003
        name: Create institution table migration
        description: |
          Create migration for financial_data.institution table:
          - V1_2__create_institution_table.sql
          - Include all columns from memory file (bacen_cod_inst PK, ano_mes_ref, nome_instituicao, etc.)
          - Add source_hash column (CHAR(64))
          - Add created_at, updated_at timestamps
          - Create indexes as needed
        files:
          - workflow/financial_data/migrations/V1_2__create_institution_table.sql
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
          - docs/05-standards/database-standards/schema-standards.md
        status: pending
        
      - id: domain-004
        name: Create ifdata_extract_task table migration
        description: |
          Create migration for financial_data.ifdata_extract_task table:
          - V1_3__create_ifdata_extract_task_table.sql
          - Natural key: (ano_mes, tipo_instituicao, nome_relatorio, numero_relatorio, page_skip)
          - Status column with enum/check constraint
          - attempt_count, last_error, last_http_status columns
          - Timestamps: started_at, finished_at, created_at, updated_at
          - Create unique constraint on natural key
        files:
          - workflow/financial_data/migrations/V1_3__create_ifdata_extract_task_table.sql
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
        status: pending
        
      - id: domain-005
        name: Create ifdata_load_control table migration
        description: |
          Create migration for financial_data.ifdata_load_control table:
          - V1_4__create_ifdata_load_control_table.sql
          - Natural key: (ano_mes, nome_relatorio)
          - Status tracking columns (extracted, promoted, completed)
          - Timestamps for tracking
          - Create unique constraint on natural key
        files:
          - workflow/financial_data/migrations/V1_4__create_ifdata_load_control_table.sql
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
        status: pending
        
      - id: domain-006
        name: Create ifdata_raw table migration
        description: |
          Create migration for financial_data.ifdata_raw staging table:
          - V1_5__create_ifdata_raw_table.sql
          - Tall/raw table structure to store CSV rows as-is
          - Include columns: ano_mes, tipo_instituicao, nome_relatorio, numero_relatorio, cod_inst, raw_data (TEXT or JSONB)
          - Create indexes for querying and promotion
        files:
          - workflow/financial_data/migrations/V1_5__create_ifdata_raw_table.sql
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
        status: pending
        
      - id: domain-007
        name: Create bank_report table migration
        description: |
          Create migration for financial_data.bank_report hot table:
          - V1_6__create_bank_report_table.sql
          - Natural key: (cod_inst, ano_mes, nome_relatorio, numero_relatorio)
          - report_data JSONB column for aggregated data
          - Timestamps: created_at, updated_at
          - Create unique constraint on natural key
          - Create indexes for common queries
        files:
          - workflow/financial_data/migrations/V1_6__create_bank_report_table.sql
        spec_references:
          - docs/04-patterns/backend-patterns/domain-model-pattern.md
        status: pending
        
      - id: domain-008
        name: Test migrations
        description: |
          Test all migrations:
          - Run migrations on test database
          - Verify schema creation
          - Verify table structures
          - Test idempotency (run migrations twice)
          - Verify constraints and indexes
        files:
          - workflow/financial_data/tests/test_migrations.py (optional)
        spec_references:
          - docs/05-standards/database-standards/schema-standards.md
        status: pending

  workflow:
    name: Workflow Phase (Prefect Flow)
    description: Implement Prefect 3.x workflow for BACEN IFData ingestion
    status: pending
    context_specs:
      - docs/05-standards/workflow-standards/batch-workflow-standard.md
      - docs/07-examples/batch-workflows/swapi-etl-workflow.md
      - docs/05-standards/observability-standards.md
    tasks:
      - id: workflow-000
        name: Set up Python project and dependencies
        description: |
          Set up Python project structure and dependencies:
          - Create workflow/financial_data/bacen_ifdata/ directory
          - Create requirements.txt with runtime dependencies:
            * prefect>=3.6.5 (workflow orchestration)
            * psycopg2-binary>=2.9.0 (PostgreSQL driver)
            * kafka-python>=2.0.0 (Kafka client)
            * requests>=2.31.0 (HTTP client for BACEN API)
            * pyway>=3.0.0 (database migrations)
            * python-dotenv>=1.0.0 (environment variables)
          - Create requirements-dev.txt with development dependencies:
            * pytest>=7.4.0 (testing framework)
            * pytest-mock>=3.12.0 (mocking)
            * pytest-cov>=4.1.0 (coverage)
            * testcontainers>=3.7.0 (integration testing)
            * black>=23.0.0 (code formatting)
            * ruff>=0.1.0 (linting)
            * mypy>=1.5.0 (type checking)
          - Create .python-version or pyproject.toml (if using pyproject)
          - Create README.md with setup instructions
          - Create .gitignore for Python project
        files:
          - workflow/financial_data/bacen_ifdata/requirements.txt
          - workflow/financial_data/bacen_ifdata/requirements-dev.txt
          - workflow/financial_data/bacen_ifdata/.python-version (optional)
          - workflow/financial_data/bacen_ifdata/.gitignore
          - workflow/financial_data/bacen_ifdata/README.md
        spec_references:
          - docs/07-examples/batch-workflows/swapi-etl-workflow.md
        status: pending
        
      - id: workflow-001
        name: Set up Prefect project structure
        description: |
          Create Prefect project structure:
          - workflow/financial_data/bacen_ifdata/
          - flows/ directory for flow files
          - tasks/ directory for task modules
          - schemas/ directory for Kafka message schemas
          - tests/ directory for tests
          - prefect.yaml configuration
        files:
          - workflow/financial_data/bacen_ifdata/flows/__init__.py
          - workflow/financial_data/bacen_ifdata/tasks/__init__.py
          - workflow/financial_data/bacen_ifdata/schemas/
          - workflow/financial_data/bacen_ifdata/prefect.yaml
        spec_references:
          - docs/07-examples/batch-workflows/swapi-etl-workflow.md
        status: pending
        
      - id: workflow-002
        name: Implement target quarter determination task
        description: |
          Create Prefect task to determine target quarter:
          - Read last extracted quarter from ifdata_load_control
          - Compute next quarter candidate
          - Check publication window logic
          - Return target_ano_mes or None if should wait
        files:
          - workflow/financial_data/bacen_ifdata/tasks/quarter_determination.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-003
        name: Implement registry ingestion task
        description: |
          Create Prefect task for registry ingestion:
          - Fetch IfDataCadastro from BACEN API (CSV format)
          - Parse CSV data
          - Compute source_hash for change detection
          - Upsert into financial_data.institution
          - Detect NEW/CHANGED/UNCHANGED
          - Return list of institutions that need Kafka events
        files:
          - workflow/financial_data/bacen_ifdata/tasks/registry_ingestion.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-004
        name: Implement report catalog fetching task
        description: |
          Create Prefect task to fetch report catalog:
          - Call ListaDeRelatorio() endpoint (JSON format)
          - Parse and return list of reports
          - Handle errors and retries
        files:
          - workflow/financial_data/bacen_ifdata/tasks/catalog_fetch.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-005
        name: Implement extract task creation
        description: |
          Create Prefect task to seed extract tasks:
          - For each report and TipoInstituicao (1-4)
          - Create ifdata_extract_task with page_skip=0
          - Use database connection to insert tasks
          - Handle idempotency (check if task already exists)
        files:
          - workflow/financial_data/bacen_ifdata/tasks/extract_task_creation.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-006
        name: Implement paginated extraction task
        description: |
          Create Prefect task for executing extract tasks:
          - Pick PENDING task, set to RUNNING
          - If page_skip=0 and reloading, purge raw for scope
          - Call BACEN API with pagination
          - Insert CSV rows into ifdata_raw
          - If rows > 0: mark SUCCESS, create next page task
          - If rows = 0: mark EMPTY (terminal)
          - Handle errors with retry logic
        files:
          - workflow/financial_data/bacen_ifdata/tasks/paginated_extraction.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-007
        name: Implement extract completion check task
        description: |
          Create Prefect task to check if all extract tasks are complete:
          - Check all tasks for quarter+report are terminal (SUCCESS or EMPTY)
          - Mark ifdata_load_control as extracted when complete
        files:
          - workflow/financial_data/bacen_ifdata/tasks/extract_completion.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-008
        name: Implement promotion task (raw to hot)
        description: |
          Create Prefect task to promote raw data to hot table:
          - Read raw data from ifdata_raw for quarter+report
          - Filter by active institutions (situacao='A')
          - Transform/pivot tall rows into JSONB documents
          - UPSERT into bank_report
          - Mark ifdata_load_control as completed
        files:
          - workflow/financial_data/bacen_ifdata/tasks/promotion.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-009
        name: Implement Kafka publishing task
        description: |
          Create Prefect task to publish Kafka events:
          - For each NEW/CHANGED institution from registry ingestion
          - Build message with schema_version, event_id, occurred_at, etc.
          - Publish to financial-data.institution.upserted topic
          - Use bacen_cod_inst as message key
          - Handle DLQ on failures
        files:
          - workflow/financial_data/bacen_ifdata/tasks/kafka_publish.py
          - workflow/financial_data/bacen_ifdata/schemas/institution_upserted.json
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-010
        name: Implement fallback handling task
        description: |
          Create Prefect task for fallback handling:
          - Persist failed payloads to durable storage
          - Send notifications (Slack/PagerDuty/email)
          - Log error details
        files:
          - workflow/financial_data/bacen_ifdata/tasks/fallback.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
        status: pending
        
      - id: workflow-011
        name: Implement main Prefect flow
        description: |
          Create main Prefect flow orchestrating all tasks:
          - Determine target quarter
          - Ensure registry exists (ingest if needed)
          - Fetch report catalog
          - Create extract tasks
          - Execute paginated extraction (with parallelism)
          - Check extract completion
          - Promote raw to hot
          - Publish Kafka events
          - Handle errors with fallback
          - Add observability (logs, metrics, artifacts)
        files:
          - workflow/financial_data/bacen_ifdata/flows/bacen_ifdata_ingestion.py
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
          - docs/07-examples/batch-workflows/swapi-etl-workflow.md
        status: pending
        
      - id: workflow-012
        name: Configure Prefect deployment
        description: |
          Configure Prefect deployment:
          - Update prefect.yaml with deployment settings
          - Set cron schedule (daily execution)
          - Configure work pool and work queue
          - Set environment variables
          - Configure retry policies
          - Set concurrency limits
        files:
          - workflow/financial_data/bacen_ifdata/prefect.yaml
        spec_references:
          - docs/05-standards/workflow-standards/batch-workflow-standard.md
          - docs/07-examples/batch-workflows/swapi-etl-workflow.md
        status: pending

