<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="733" viewBox="0 0 1080 733" role="img" aria-labelledby="title desc">
<title id="title">Level 1 · Product Strategy</title>
<desc id="desc">The person and agent use the Product Strategy skill to draft, review, and save a strategy. The Product Map opens the Product Strategy document, which defines an objective for fewer confirmed overlapping reservations. The level 2 Initiative Brief links directly to that objective.</desc>
