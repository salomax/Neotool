<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="693" viewBox="0 0 1080 693" role="img" aria-labelledby="title desc">
<title id="title">Level 2 · Opportunity and initiative</title>
<desc id="desc">A person and an AI agent explore an opportunity, agree on what to investigate, and save Initiative Brief INIT-01 with a direct link to strategic objective OBJ-01.</desc>
<rect width="1080" height="693" rx="18" fill="#fffdf9"/>
<g font-family="Trebuchet MS, Verdana, sans-serif">
<text x="28" y="52" font-size="34" font-weight="700" fill="#233047">Level 2 · Opportunity and initiative</text>
<text x="29" y="87" font-size="22" font-weight="400" fill="#4b5870">What problem merits work now, and what supports that choice?</text>
<rect x="28" y="115" width="1024" height="187" rx="15" fill="#edf8f7"/>
<path d="M43 116 Q540.0 113 1037 116 Q1053 115 1052 131 L1051 287 Q1052 303 1036 302 Q540.0 304 44 301 Q27 302 28 286 L29 130 Q28 115 43 116 Z" fill="none" stroke="#22686b" stroke-width="1.8" stroke-dasharray="9 6"/>
<path d="M43 116 Q540.0 113 1037 116 Q1053 115 1052 131 L1051 287 Q1052 303 1036 302 Q540.0 304 44 301 Q27 302 28 286 L29 130 Q28 115 43 116 Z" transform="translate(1 -1)" fill="none" stroke="#22686b" stroke-width=".8" opacity=".42" stroke-dasharray="9 6"/>
<text x="46" y="148" font-size="23" font-weight="700" fill="#22686b">Agent session · Opportunity exploration</text>
<text x="48" y="192" font-size="18" font-weight="700" fill="#233047">Person brings context</text>
<text x="48" y="223" font-size="16" font-weight="400" fill="#233047">Shares reports of double bookings.</text>
<text x="48" y="251" font-size="16" font-weight="400" fill="#233047">Opens the strategy at OBJ-01.</text>
<path d="M308 222 Q321.5 220 335 223 m-7 -6 l7 6 -8 5" fill="none" stroke="#345da7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="192" font-size="18" font-weight="700" fill="#233047">Agent explores the opportunity</text>
<text x="350" y="223" font-size="16" font-weight="400" fill="#233047">Asks who is affected and when.</text>
<text x="350" y="251" font-size="16" font-weight="400" fill="#233047">Separates reports from hypotheses.</text>
<path d="M660 222 Q674.0 220 688 223 m-7 -6 l7 6 -8 5" fill="none" stroke="#345da7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="705" y="192" font-size="18" font-weight="700" fill="#233047">Person + agent choose a next step</text>
<text x="705" y="223" font-size="16" font-weight="400" fill="#233047">Person confirms what to investigate.</text>
<text x="705" y="251" font-size="16" font-weight="400" fill="#233047">Agent saves the brief using the template.</text>
<path d="M369 307 Q371 331 370 357 m-6 -8 l6 8 6 -8" fill="none" stroke="#345da7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="383" y="337" font-size="15" font-weight="400" fill="#345da7">Creates or updates</text>
<rect x="28" y="365" width="666" height="300" rx="15" fill="#fff8e9"/>
<path d="M43 366 Q361.0 363 679 366 Q695 365 694 381 L693 650 Q694 666 678 665 Q361.0 667 44 664 Q27 665 28 649 L29 380 Q28 365 43 366 Z" fill="none" stroke="#896522" stroke-width="1.8"/>
<path d="M43 366 Q361.0 363 679 366 Q695 365 694 381 L693 650 Q694 666 678 665 Q361.0 667 44 664 Q27 665 28 649 L29 380 Q28 365 43 366 Z" transform="translate(1 -1)" fill="none" stroke="#896522" stroke-width=".8" opacity=".42"/>
<text x="49" y="402" font-size="24" font-weight="700" fill="#735019">Initiative Brief · INIT-01</text>
<text x="49" y="431" font-size="16" font-weight="400" fill="#4b5870">A document · initiative-brief.md</text>
<text x="49" y="468" font-size="17" font-weight="400" fill="#233047">Scope: Pilot booking for one shared meeting room</text>
<text x="49" y="499" font-size="17" font-weight="400" fill="#233047">Observation: Staff report conflicting chat confirmations</text>
<text x="49" y="530" font-size="17" font-weight="400" fill="#233047">Hypothesis: Showing availability earlier may reduce conflicts</text>
<text x="49" y="561" font-size="17" font-weight="400" fill="#233047">Next move: Review five days of chat confirmations</text>
<text x="49" y="591" font-size="16" font-weight="400" fill="#4b5870">Use the review to decide whether the pilot can be measured.</text>
<text x="49" y="639" font-size="18" font-weight="700" fill="#345da7">Strategy link: OBJ-01</text>
<text x="700" y="615" font-size="15" font-weight="400" fill="#276459">advances</text>
<rect x="785" y="511" width="267" height="154" rx="15" fill="#edf3ff"/>
