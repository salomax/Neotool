<text x="803" y="539" font-size="17" font-weight="700" fill="#345da7">Product Strategy · Level 1</text>
<rect x="800" y="558" width="237" height="91" rx="15" fill="#eef8f3"/>
<path d="M815 559 Q918.5 556 1022 559 Q1038 558 1037 574 L1036 634 Q1037 650 1021 649 Q918.5 651 816 648 Q799 649 800 633 L801 573 Q800 558 815 559 Z" fill="none" stroke="#276459" stroke-width="1.8"/>
<path d="M815 559 Q918.5 556 1022 559 Q1038 558 1037 574 L1036 634 Q1037 650 1021 649 Q918.5 651 816 648 Q799 649 800 633 L801 573 Q800 558 815 559 Z" transform="translate(1 -1)" fill="none" stroke="#276459" stroke-width=".8" opacity=".42"/>
<text x="815" y="587" font-size="19" font-weight="700" fill="#276459">OBJ-01</text>
<text x="815" y="623" font-size="17" font-weight="400" fill="#233047">Reduce booking conflicts</text>
