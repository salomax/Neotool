"""Asset metadata and access information."""
type Asset
  @join__type(graph: ASSETS, key: "id")
  @join__type(graph: BANKING, key: "id")
  @join__type(graph: FINANCIALDATA, key: "id")
{
  """Unique identifier (UUID v7)"""
  id: ID!

  """User or system that owns this asset"""
  ownerId: String! @join__field(graph: ASSETS)

  """Logical grouping (e.g., user-profiles, group-assets)"""
  namespace: String! @join__field(graph: ASSETS)

  """Visibility level - determines access control and URL generation"""
  visibility: AssetVisibility! @join__field(graph: ASSETS)

  """Unique key in S3/R2 storage"""
  storageKey: String! @join__field(graph: ASSETS)

  """Storage region"""
  storageRegion: String! @join__field(graph: ASSETS)

  """Storage bucket name"""
  storageBucket: String! @join__field(graph: ASSETS)

  """MIME type (e.g., image/jpeg, application/pdf)"""
  mimeType: String! @join__field(graph: ASSETS)

  """File size in bytes (null until upload confirmed)"""
  sizeBytes: Long @join__field(graph: ASSETS)

  """SHA-256 checksum for integrity verification"""
  checksum: String @join__field(graph: ASSETS)

  """Original filename from client upload"""
  originalFilename: String @join__field(graph: ASSETS)

  """
  Pre-signed upload URL (temporary, only available for PENDING assets).
  Client uploads file directly to this URL.
  """
  uploadUrl: String @join__field(graph: ASSETS)

  """When the upload URL expires"""
  uploadExpiresAt: DateTime @join__field(graph: ASSETS)

  """
  Public CDN URL for accessing the asset.
  Only available for READY PUBLIC assets. Returns null for PRIVATE assets (use downloadUrl instead).
  """
  publicUrl: String @join__field(graph: ASSETS)

  """
  Presigned download URL for PRIVATE assets.
  Returns null for PUBLIC assets (use publicUrl instead).
  @param ttlSeconds Time-to-live for the presigned URL (default: 3600 seconds / 1 hour)
  """
  downloadUrl(ttlSeconds: Int = 3600): String @join__field(graph: ASSETS)

  """Upload status"""
  status: AssetStatus! @join__field(graph: ASSETS)

  """Client-provided key to prevent duplicate uploads (optional)"""
  idempotencyKey: String @join__field(graph: ASSETS)

  """Timestamp when asset record was created"""
  createdAt: DateTime! @join__field(graph: ASSETS)

  """Timestamp when asset record was last updated"""
  updatedAt: DateTime! @join__field(graph: ASSETS)

  """Timestamp when asset was deleted (null if active)"""
  deletedAt: DateTime @join__field(graph: ASSETS)
}

