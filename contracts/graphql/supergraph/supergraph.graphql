"""
Lifecycle status of a credit card bill (fatura).
OPEN    → closingDate >= today (bill still accepting charges).
CLOSED  → closingDate < today and dueDate >= today (awaiting payment).
OVERDUE → dueDate < today and not yet paid.
PAID    → terminal state.
"""
enum BillStatus
  @join__type(graph: BANKING)
{
  OPEN @join__enumValue(graph: BANKING)
  CLOSED @join__enumValue(graph: BANKING)
  PAID @join__enumValue(graph: BANKING)
  OVERDUE @join__enumValue(graph: BANKING)
}

