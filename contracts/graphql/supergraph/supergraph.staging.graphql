  """Create a new manual transaction."""
  createTransaction(input: CreateTransactionInput!): Transaction! @join__field(graph: BANKING)

  """Update an existing manual transaction."""
  updateTransaction(id: ID!, input: UpdateTransactionInput!): Transaction! @join__field(graph: BANKING)

  """Soft-delete a manual transaction."""
  deleteTransaction(id: ID!): Boolean! @join__field(graph: BANKING)
  importTransactionsFile(input: ImportTransactionsFileInput!): ImportResult! @join__field(graph: BANKING)
  importNfce(financialAccountId: ID!, qrCodeUrl: String!): ImportResult! @join__field(graph: BANKING)
  resolveImportDuplicate(input: ResolveImportDuplicateInput!): TransactionImport! @join__field(graph: BANKING)
  submitPdfBillImport(input: SubmitPdfBillImportInput!): PdfImportJob! @join__field(graph: BANKING)
  confirmPdfBillImport(input: ConfirmPdfBillImportInput!): PdfImportJob! @join__field(graph: BANKING)

  """
  Register a payment against a credit card bill. Creates a CREDIT TRANSFER on the card account.
  Optionally creates a DEBIT TRANSFER on sourceAccountId (e.g. bank account). Marks bill as PAID when payment covers full amount.
  """
  payBill(billId: ID!, amount: Float!, sourceAccountId: ID): CreditCardBill! @join__field(graph: BANKING)
  signIn(input: SignInInput!): SignInPayload! @join__field(graph: SECURITY)
