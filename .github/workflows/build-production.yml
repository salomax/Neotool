name: Production Build

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/invistus

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  build-kotlin:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: security
            dockerfile: security/Dockerfile
            image: neotool-security
          - service: assets
            dockerfile: assets/Dockerfile
            image: neotool-assets
          - service: financialdata
            dockerfile: financialdata/Dockerfile
            image: neotool-financialdata
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./service/kotlin
          file: ./service/kotlin/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  build-golang:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bacen-ifdata
            context: ./workflow/golang
            dockerfile: ./workflow/golang/financial_data/bacen_ifdata_job/Dockerfile
            target: cronjob
            image: neotool-bacen-ifdata-cronjob
            app_dir: financial_data/bacen_ifdata_job
          - service: ratings
            context: ./workflow/golang
            dockerfile: ./workflow/golang/financial_data/ratings_job/Dockerfile
            image: neotool-financialdata-ratings
            app_dir: financial_data/ratings_job
          - service: indicators
            context: ./workflow/golang
            dockerfile: ./workflow/golang/financial_data/indicators_job/Dockerfile
            image: neotool-financialdata-indicators
            app_dir: financial_data/indicators_job
          - service: institution-enhancement-consumer
            context: ./workflow/golang
            dockerfile: ./workflow/golang/financial_data/institution_enhancement_consumer/Dockerfile
            target: consumer
            image: neotool-institution-enhancement-consumer
            app_dir: financial_data/institution_enhancement_consumer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          build-args: |
            APP_DIR=${{ matrix.app_dir }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  build-web:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/neotool-web:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/neotool-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  cleanup-packages:
    needs: [build-kotlin, build-golang, build-web]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - neotool-security
          - neotool-assets
          - neotool-financialdata
          - neotool-bacen-ifdata-cronjob
          - neotool-financialdata-ratings
          - neotool-financialdata-indicators
          - neotool-institution-enhancement-consumer
          - neotool-web
    steps:
      - name: Delete old versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          owner: invistus
          min-versions-to-keep: 3

  trigger-supergraph:
    needs: [build-kotlin, build-golang, build-web, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: invistus,invistus-flux

      - name: Trigger supergraph composition
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/invistus/invistus-flux/dispatches \
            -d '{
              "event_type": "service-deployed",
              "client_payload": {
                "version": "${{ needs.version.outputs.version }}",
                "environment": "production",
                "trigger_source": "service_deployment",
                "services": ["security", "assets", "financialdata", "web"]
              }
            }'

      - name: Log supergraph trigger
        run: |
          echo "✅ Triggered supergraph composition in invistus-flux repo"
          echo "Version: ${{ needs.version.outputs.version }}"
          echo "The router will automatically update with the new supergraph schema within ~10 minutes"

  release:
    needs: [build-kotlin, build-golang, build-web, version, trigger-supergraph]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
