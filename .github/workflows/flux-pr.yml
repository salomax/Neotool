name: Flux PR Automation

on:
  push:
    branches:
      - flux-updates

permissions:
  contents: write
  pull-requests: write

jobs:
  open-or-update-pr:
    name: Open or Update PR
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:flux-updates`;
            const base = 'main';
            const title = 'chore(flux): update images';
            const body = [
              'Automated PR created by Flux image update automation.',
              '',
              '- Branch: `flux-updates`',
              '- Base: `main`',
            ].join('\n');

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head,
              state: 'open',
            });

            if (prs.length > 0) {
              core.info(`PR already open: #${prs[0].number}`);
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: 'flux-updates',
              base,
              body,
            });
            core.info('PR created successfully.');
