name: Sync Supergraph Schema

on:
  push:
    branches: [main]
    paths:
      - 'contracts/graphql/**'

jobs:
  trigger-supergraph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: invistus,invistus-flux

      - name: Trigger supergraph composition
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/invistus/invistus-flux/dispatches \
            -d '{
              "event_type": "service-deployed",
              "client_payload": {
                "project": "schema-contracts",
                "version": "n/a",
                "environment": "production",
                "trigger_source": "schema_contract_change"
              }
            }'
