name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    # TODO: Uncomment when CI is re-enabled to ensure only passing code gets released
    # if: github.event.head_commit.message != 'chore(release): publish [skip ci]'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "invistusbot[bot]"
          git config user.email "${{ secrets.GH_APP_ID }}+invistusbot[bot]@users.noreply.github.com"

      - name: Strip Gradle plugin for faster graph
        run: jq '.plugins = [.plugins[] | select(.plugin != "@nx/gradle")]' nx.json > nx.tmp && mv nx.tmp nx.json

      - name: Release
        timeout-minutes: 30
        run: npx nx release --skip-publish --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Trigger builds for new tags
        run: |
          for TAG in $(git tag --points-at HEAD --list '*-v*'); do
            echo "Triggering build-production for $TAG"
            gh workflow run build-production.yml --ref "$TAG"
            sleep 1
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
