name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    # TODO: Uncomment when CI is re-enabled to ensure only passing code gets released
    # if: github.event.head_commit.message != 'chore(release): publish [skip ci]'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "invistusbot[bot]"
          git config user.email "${{ secrets.GH_APP_ID }}+invistusbot[bot]@users.noreply.github.com"

      - name: Strip Gradle plugin for faster graph
        run: |
          echo "Before:"
          cat nx.json | head -15
          jq 'if .plugins then .plugins = [.plugins[] | select(.plugin != "@nx/gradle")] else . end' nx.json > nx.tmp && mv nx.tmp nx.json
          echo "After:"
          cat nx.json | head -15

      - name: Release
        timeout-minutes: 30
        run: |
          FIRST_RELEASE=""
          if ! git tag --list '*-v*' | grep -q .; then
            echo "No existing release tags found — running as first release"
            FIRST_RELEASE="--first-release"
          fi
          npx nx release $FIRST_RELEASE --skip-publish --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Trigger builds for new tags
        run: |
          TAGS=$(git tag --points-at HEAD --list '*-v*')
          if [ -z "$TAGS" ]; then
            echo "No new tags found — skipping build triggers"
            exit 0
          fi
          # Get workflow ID
          WF_ID=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows" \
            | jq '.workflows[] | select(.name == "Production Build") | .id')
          echo "Workflow ID: $WF_ID"
          for TAG in $TAGS; do
            echo "Triggering build-production for $TAG"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF_ID/dispatches" \
              -d "{\"ref\":\"$TAG\"}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            if [ "$HTTP_CODE" = "204" ]; then
              echo "  Success (HTTP $HTTP_CODE)"
            else
              echo "  Failed (HTTP $HTTP_CODE): $BODY"
              exit 1
            fi
            sleep 1
          done
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
