name: MCP External Synthetic Check

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: mcp-external-synthetic-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe-public-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - user_agent: Claude-User
            probe_id: probe-claude-user
          - user_agent: ChatGPT-User
            probe_id: probe-chatgpt-user
    env:
      MCP_URL: https://mcp.invistus.com.br/mcp
      EXPECTED_PROTOCOL_VERSION: '2025-06-18'
    steps:
      # This synthetic check must run from a GitHub-hosted runner instead of an
      # in-cluster blackbox probe. A pod resolving mcp.invistus.com.br can hairpin
      # to the origin and never traverse Cloudflare, which would allow the probe to
      # stay green while real external clients are blocked at the edge.
      - name: Probe public MCP edge
        env:
          USER_AGENT: ${{ matrix.user_agent }}
          PROBE_ID: ${{ matrix.probe_id }}
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          headers_file="$(mktemp)"
          normalized_headers_file="$(mktemp)"
          payload="$(cat <<JSON
          {
            "jsonrpc": "2.0",
            "id": "${PROBE_ID}",
            "method": "initialize",
            "params": {
              "protocolVersion": "${EXPECTED_PROTOCOL_VERSION}",
              "capabilities": {},
              "clientInfo": {
                "name": "github-actions-synthetic-check",
                "version": "1.0.0"
              }
            }
          }
          JSON
          )"

          status="$(curl -sS \
            --max-time 30 \
            -o "${body_file}" \
            -D "${headers_file}" \
            -X POST "${MCP_URL}" \
            -H 'Content-Type: application/json' \
            -H "User-Agent: ${USER_AGENT}" \
            --data "${payload}" \
            -w '%{http_code}')"

          tr '[:upper:]' '[:lower:]' < "${headers_file}" > "${normalized_headers_file}"
          content_type="$(grep -m1 '^content-type:' "${normalized_headers_file}" | cut -d':' -f2- | tr -d '\r' | xargs || true)"
          www_authenticate="$(grep -m1 '^www-authenticate:' "${normalized_headers_file}" | cut -d':' -f2- | tr -d '\r' | xargs || true)"
          cf_mitigated="$(grep -m1 '^cf-mitigated:' "${normalized_headers_file}" | cut -d':' -f2- | tr -d '\r' | xargs || true)"

          {
            echo "### ${USER_AGENT}"
            echo "- URL: \`${MCP_URL}\`"
            echo "- Method: \`POST\`"
            echo "- Status: \`${status}\`"
            echo "- Content-Type: \`${content_type:-<missing>}\`"
            echo "- WWW-Authenticate: \`${www_authenticate:-<missing>}\`"
            echo "- cf-mitigated: \`${cf_mitigated:-<missing>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${status}" != "401" && "${status}" != "200" ]]; then
            echo "::error::Unexpected MCP edge status for ${USER_AGENT}: ${status}"
            echo "Response headers:"
            cat "${headers_file}"
            echo "Response body:"
            cat "${body_file}"
            exit 1
          fi

          if [[ "${status}" == "401" && "${www_authenticate}" == "" ]]; then
            echo "::error::Expected WWW-Authenticate header on 401 response for ${USER_AGENT}"
            cat "${headers_file}"
            exit 1
          fi

          if [[ "${content_type}" != application/json* ]]; then
            echo "::error::Expected application/json content type for ${USER_AGENT}, got '${content_type:-<missing>}'"
            echo "Response headers:"
            cat "${headers_file}"
            echo "Response body:"
            cat "${body_file}"
            exit 1
          fi
