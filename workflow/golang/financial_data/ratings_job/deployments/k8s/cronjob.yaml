apiVersion: batch/v1
kind: CronJob
metadata:
  name: financialdata-ratings
  namespace: production
  labels:
    app: financialdata-ratings
spec:
  # Every Saturday at 6:00 AM (Sao Paulo timezone)
  schedule: "0 6 * * 6"
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: financialdata-ratings
    spec:
      # Maximum time for job to complete (2 hours)
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: financialdata-ratings
        spec:
          containers:
            - name: cronjob
              image: ghcr.io/invistus/neotool-financialdata-ratings:latest # {"$imagepolicy": "flux-system:neotool-financialdata-ratings"}
              imagePullPolicy: Always
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: financialdata-ratings-config
                - secretRef:
                    name: financialdata-ratings-secrets
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          imagePullSecrets:
            - name: ghcr-credentials
