apiVersion: batch/v1
kind: CronJob
metadata:
  name: institution-enhancement-standalone-go
  namespace: financial-data
  labels:
    app: institution-enhancement-standalone-go
spec:
  # Example schedule: daily at 3 AM
  schedule: "0 3 * * *"
  # Timezone (requires Kubernetes 1.25+)
  # timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: institution-enhancement-standalone-go
    spec:
      template:
        metadata:
          labels:
            app: institution-enhancement-standalone-go
        spec:
          containers:
          - name: standalone
            image: institution-enhancement-standalone-go:latest
            imagePullPolicy: IfNotPresent
            # Example CNPJ argument - replace with actual CNPJ or parameterize
            args: ["12345678000190"]
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
            envFrom:
            - configMapRef:
                name: institution-enhancement-config
            - secretRef:
                name: institution-enhancement-secrets
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 10
