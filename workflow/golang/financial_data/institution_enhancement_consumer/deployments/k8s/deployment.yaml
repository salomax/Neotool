apiVersion: apps/v1
kind: Deployment
metadata:
  name: institution-enhancement-consumer-go
  namespace: financial-data
  labels:
    app: institution-enhancement-consumer-go
    version: v1
spec:
  # IMPORTANT: Single replica required for in-memory rate limiter (15s between CNPJá API calls)
  replicas: 1
  selector:
    matchLabels:
      app: institution-enhancement-consumer-go
  template:
    metadata:
      labels:
        app: institution-enhancement-consumer-go
        version: v1
    spec:
      containers:
      - name: consumer
        image: institution-enhancement-consumer-go:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        envFrom:
        - configMapRef:
            name: institution-enhancement-config
        - secretRef:
            name: institution-enhancement-secrets
        ports:
        - containerPort: 8080
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
