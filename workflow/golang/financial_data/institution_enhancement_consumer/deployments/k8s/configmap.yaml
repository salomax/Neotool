apiVersion: v1
kind: ConfigMap
metadata:
  name: institution-enhancement-config
  namespace: production
data:
  # PostgreSQL Configuration (via PGBouncer)
  POSTGRES_HOST: "pgbouncer.production.svc.cluster.local"
  POSTGRES_PORT: "6432"
  POSTGRES_POOL_MIN: "2"
  POSTGRES_POOL_MAX: "10"

  # Kafka Configuration
  KAFKA_BROKERS: "kafka.production.svc.cluster.local:9092"
  KAFKA_TOPIC: "financial-data.institution.upserted"
  KAFKA_CONSUMER_GROUP: "institution-enhancement-consumer-go"
  KAFKA_DLQ_TOPIC: "financial-data.institution.upserted.enhancement.dlq"

  # CNPJá API Configuration
  CNPJA_BASE_URL: "https://open.cnpja.com"
  CNPJA_TIMEOUT_SECONDS: "30"
  CNPJA_RATE_LIMIT_SECONDS: "15"

  # Assets Service (GraphQL via Apollo Router)
  ASSETS_APOLLO_ROUTER_URL: "http://neotool-router.production.svc.cluster.local:4000/graphql"
  ASSETS_NAMESPACE: "institution-logos"
  ASSETS_UPLOAD_TIMEOUT_SECONDS: "60"
  ASSETS_GRAPHQL_TIMEOUT_SECONDS: "30"

  # Security Service (service-to-service auth)
  SECURITY_HOST: "neotool-security.production.svc.cluster.local:8080"
  SECURITY_TIMEOUT_SECONDS: "10"

  # Health Check Configuration
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_PORT: "8080"

  # Worker Pool
  WORKER_POOL_SIZE: "5"

  # Retry Configuration
  RETRY_MAX_RETRIES: "3"
  RETRY_INITIAL_DELAY_MS: "1000"
  RETRY_MAX_DELAY_MS: "30000"
  RETRY_BACKOFF_MULTIPLIER: "2.0"
  RETRY_JITTER: "true"
