apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: institution-enhancement-secrets
  namespace: production
  labels:
    app: institution-enhancement-consumer-go
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: institution-enhancement-secrets
    creationPolicy: Owner
  data:
    # PostgreSQL credentials
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/postgres
        property: password
    # Service-to-service auth credentials (registered via ./neotool service register)
    - secretKey: SECURITY_SERVICE_ID
      remoteRef:
        key: secret/services/institution-enhancement/credentials
        property: service_id
    - secretKey: SECURITY_SERVICE_SECRET
      remoteRef:
        key: secret/services/institution-enhancement/credentials
        property: client_secret
    # External API keys
    - secretKey: LOGO_DEV_TOKEN
      remoteRef:
        key: secret/services/institution-enhancement/api-keys
        property: logo_dev_token
