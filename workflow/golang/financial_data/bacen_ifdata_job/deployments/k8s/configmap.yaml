apiVersion: v1
kind: ConfigMap
metadata:
  name: bacen-ifdata-config
  namespace: production
  labels:
    app: bacen-ifdata-cronjob
data:
  # PostgreSQL via PGBouncer
  POSTGRES_HOST: "pgbouncer.production.svc.cluster.local"
  POSTGRES_PORT: "6432"
  POSTGRES_DB: "neotool_db"
  POSTGRES_POOL_MIN: "2"
  POSTGRES_POOL_MAX: "10"

  # BACEN API Configuration
  BACEN_BASE_URL: "https://olinda.bcb.gov.br/olinda/servico/IFDATA/versao/v1/odata/"
  BACEN_TIMEOUT_SECONDS: "60"

  # Kafka Configuration
  KAFKA_BROKERS: "kafka-0.kafka.svc.cluster.local:9092,kafka-1.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "financial-data.institution.upserted"
  KAFKA_COMPRESSION_TYPE: "gzip"

  # Retry Configuration
  RETRY_MAX_RETRIES: "3"
  RETRY_INITIAL_DELAY_MS: "1000"
  RETRY_MAX_DELAY_MS: "30000"
  RETRY_BACKOFF_MULTIPLIER: "2.0"
  RETRY_JITTER: "true"

  # Extraction Configuration
  EXTRACTION_MAX_WORKERS: "5"
  EXTRACTION_MAX_ITERATIONS: "1000"
  EXTRACTION_PAGE_SIZE: "5000"
  EXTRACTION_MAX_TASK_RETRIES: "3"
  EXTRACTION_TASK_POLL_INTERVAL_MS: "1000"

  # Health Check Configuration
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_PORT: "8080"
