apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bacen-ifdata-secrets
  namespace: production
  labels:
    app: bacen-ifdata-cronjob
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: bacen-ifdata-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/postgres
        property: password
