# Pyway configuration for BACEN IFData migrations
# 
# Environment variables can override these values (priority: env vars > config file > CLI args)
# Set POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB
#
# Migration naming convention: V{version}__{description}.sql
# Example: V1_1__create_financial_data_schema.sql
#
database_type: postgres
database_username: neotool
database_password: neotool
database_host: localhost
database_port: 6432
database_name: neotool_db
database_migration_dir: migrations
database_table: public.pyway_schema_history_financial_data
