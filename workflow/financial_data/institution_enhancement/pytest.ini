[pytest]
# Set pythonpath so tests can import from tasks and workflow.common
# This points to the project root (parent of workflow/ directory)
# From institution_enhancement/: ../../.. goes to project root
pythonpath = ../../..
markers =
    integration: Integration tests that require Docker and external services
    unit: Unit tests

filterwarnings =
    ignore::DeprecationWarning:testcontainers.*
    ignore:.*System time is way off.*::urllib3.*


