[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "institution-enhancement"
version = "0.1.0"
description = "Kafka consumer for institution data enhancement"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "neotool-common",
    "kafka-python>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "cloudscraper>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
institution-enhancement-consumer = "institution_enhancement.flows.consumer:main"
institution-enhancement-standalone = "institution_enhancement.flows.standalone:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
