groups:
  - name: external-secrets-alerts
    rules:
      - alert: ExternalSecretSyncFailed
        expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing"
          description: >-
            ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has Ready=False.
            External Secrets fails the entire refresh when any single key cannot be resolved,
            so the Kubernetes Secret is frozen at its last successful content: new Vault fields
            will not appear, and secret rotations will not propagate, with no other signal.
            Check: kubectl get externalsecret {{ $labels.name }} -n {{ $labels.namespace }}
            -o jsonpath='{.status.conditions}' | jq
