# Apollo Router v2.7.0 configuration (local dev)
supergraph:
  path: /graphql

cors:
  allow_any_origin: true

# Show detailed subgraph errors for debugging
include_subgraph_errors:
  all: true

# Local subgraphs (e.g. financialdata bacenInstitutionSlugs) can be slow; allow 60s
traffic_shaping:
  all:
    timeout: 60s

# Telemetry: export traces to Tempo (local Docker)
telemetry:
  exporters:
    tracing:
      otlp:
        enabled: true
        endpoint: http://tempo:4317
        protocol: grpc
  instrumentation:
    spans:
      mode: spec_compliant

# Header propagation (W3C Trace Context for distributed tracing)
headers:
  all:
    request:
      - propagate:
          named: authorization
      - propagate:
          named: x-request-id
      - propagate:
          named: traceparent
      - propagate:
          named: tracestate
      - propagate:
          named: baggage
