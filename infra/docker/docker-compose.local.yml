
services:

  # -------------------------------------------------------------
  # Tooling Stack (database)
  # Profile: database
  # -------------------------------------------------------------
  postgres:
    image: postgres:18rc1
    container_name: neotool-postgres
    restart: unless-stopped
    env_file: ../.env.local
    ports: ["5432:5432"]      
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - postgres-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - database

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: neotool-pgbouncer
    env_file: ../.env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports: ["6432:6432"]
    volumes:
      - ../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    networks:
      - default
      - postgres-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles:
      - database

  # -------------------------------------------------------------
  # Kafka Stack (KRaft mode - no Zookeeper needed)
  # Profile: kafka
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: neotool-kafka
    restart: unless-stopped
    ports:
    - "9092:9092"  # Internal Docker network
    - "9094:9094"  # External access (host machine)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    profiles:
      - kafka

  # -------------------------------------------------------------
  # Institution Enhancement Consumer (Go)
  # -------------------------------------------------------------
  institution-enhancement-consumer:
    build:
      context: ../../workflow/go/financial_data/institution_enhancement
      dockerfile: deployments/docker/Dockerfile
      target: consumer
    container_name: neotool-institution-enhancement-consumer-go
    env_file: ../.env.local
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: financial-data.institution.upserted
      KAFKA_CONSUMER_GROUP: institution-enhancement-consumer-go
      KAFKA_DLQ_TOPIC: financial-data.institution.upserted.enhancement.dlq
      CNPJA_TIMEOUT_SECONDS: 30
      CNPJA_RATE_LIMIT_SECONDS: 15
      HEALTH_CHECK_ENABLED: "true"
      HEALTH_CHECK_PORT: 8080
      RETRY_MAX_RETRIES: 3
      RETRY_INITIAL_DELAY_MS: 1000
      RETRY_MAX_DELAY_MS: 30000
      RETRY_BACKOFF_MULTIPLIER: 2.0
      RETRY_JITTER: "true"
    restart: unless-stopped
    ports:
      - "8080:8080"  # Health check endpoint
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # -------------------------------------------------------------
  # Institution Enhancement Consumer (Python)
  # -------------------------------------------------------------
  institution-enhancement-consumer-python:
    build:
      context: ../../workflow/python
      dockerfile: financial_data/institution_enhancement/Dockerfile
    container_name: neotool-institution-enhancement-consumer-python
    env_file: ../.env.local
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_DB: neotool_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_INPUT_TOPIC: financial-data.institution.upserted
      KAFKA_CONSUMER_GROUP: institution-enhancement-consumer-python
      KAFKA_DLQ_TOPIC: financial-data.institution.upserted.enhancement.dlq
      CNPJA_BASE_URL: https://open.cnpja.com/office
      CNPJA_API_TIMEOUT: 30
      CNPJA_RATE_LIMIT_SECONDS: 15
      HEALTH_CHECK_ENABLED: "true"
      HEALTH_CHECK_PORT: 8081
      MAX_RETRIES: 3
      INITIAL_RETRY_DELAY_MS: 1000
      MAX_RETRY_DELAY_MS: 30000
      RETRY_BACKOFF_MULTIPLIER: 2.0
      RETRY_JITTER: "true"
      POSTGRES_POOL_MIN: 2
      POSTGRES_POOL_MAX: 10
    restart: unless-stopped
    ports:
      - "8081:8081"  # Health check endpoint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # -------------------------------------------------------------
  # Institution Enhancement DLQ Consumer (Go) - ON-DEMAND ONLY
  # Usage: docker compose -f infra/docker/docker-compose.local.yml run --rm institution-enhancement-dlq-consumer
  # -------------------------------------------------------------
  institution-enhancement-dlq-consumer:
    build:
      context: ../../workflow/go/financial_data/institution_enhancement
      dockerfile: deployments/docker/Dockerfile
      target: dlq-consumer
    env_file: ../.env.local
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: financial-data.institution.upserted
      KAFKA_CONSUMER_GROUP: institution-enhancement-consumer-go-dlq
      KAFKA_DLQ_TOPIC: financial-data.institution.upserted.enhancement.dlq
      CNPJA_TIMEOUT_SECONDS: 30
      CNPJA_RATE_LIMIT_SECONDS: 15
      HEALTH_CHECK_ENABLED: "false"
      RETRY_MAX_RETRIES: 3
      RETRY_INITIAL_DELAY_MS: 1000
      RETRY_MAX_DELAY_MS: 30000
      RETRY_BACKOFF_MULTIPLIER: 2.0
      RETRY_JITTER: "true"
    profiles:
      - tools  # Only runs when explicitly called with --profile tools or via 'run'

  # -------------------------------------------------------------
  # Institution Enhancement DLQ Inspector (Go) - ON-DEMAND ONLY
  # Usage: docker compose -f infra/docker/docker-compose.local.yml run --rm institution-enhancement-dlq-inspector
  # -------------------------------------------------------------
  institution-enhancement-dlq-inspector:
    build:
      context: ../../workflow/go/financial_data/institution_enhancement
      dockerfile: deployments/docker/Dockerfile
      target: dlq-inspector
    env_file: ../.env.local
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_DLQ_TOPIC: financial-data.institution.upserted.enhancement.dlq
    profiles:
      - tools  # Only runs when explicitly called

  # -------------------------------------------------------------
  # DLQ Retry Consumer (Go) - Shared Service
  # Automatically retries transient errors from all DLQs with cooling-off periods
  # Can be run as:
  #   - CronJob in K8s (recommended for production)
  #   - On-demand: docker compose -f infra/docker/docker-compose.local.yml run --rm dlq-retry-consumer
  #   - Scheduled daemon (use --profile dlq-retry for auto-start)
  # -------------------------------------------------------------
  dlq-retry-consumer:
    build:
      context: ../../workflow/go/shared/dlq-retry-consumer
      dockerfile: Dockerfile
    container_name: neotool-dlq-retry-consumer
    env_file: ../.env.local
    environment:
      KAFKA_BROKERS: kafka:9092
      DLQ_CONFIG_PATH: /app/config/dlq-mappings.yaml
      LOG_LEVEL: info
    volumes:
      # Mount custom config if needed (optional - uses default if not provided)
      - ../../workflow/go/shared/dlq-retry-consumer/config/dlq-mappings.yaml:/app/config/dlq-mappings.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - tools  # Only runs when explicitly called or use --profile dlq-retry for auto-start
    restart: "no"  # Don't auto-restart - designed for one-shot execution

  # -------------------------------------------------------------
  # Prefect Stack
  # Profile: prefect
  # -------------------------------------------------------------
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: neotool-prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://localhost:4200/api
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles:
      - prefect

  prefect-ui:
    image: prefecthq/prefect:3-latest
    container_name: neotool-prefect-ui
    command: prefect server start --host 0.0.0.0 --ui
    ports:
      - "4201:4200"
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    profiles:
      - prefect

  prefect-init:
    image: prefecthq/prefect:3-latest
    container_name: neotool-prefect-init
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ../../../workflow:/workflow:ro
      - ../prefect/init-prefect.sh:/init-prefect.sh:ro
    command: ["/bin/sh", "/init-prefect.sh"]
    profiles:
      - prefect
    restart: "no"  # Only run once, don't restart on failure

  # -------------------------------------------------------------
  # API Gateway Stack
  # Profile: gateway
  # -------------------------------------------------------------

  router:
    image: ghcr.io/apollographql/router:v2.7.0
    container_name: neotool-graphql-router
    ports:
      - "4000:4000"
      - "8088:8088"  # Health check port
      - "9091:9090"  # Metrics port (changed to avoid conflict with Prometheus)
    volumes:
      - ../../contracts/graphql/supergraph/supergraph.local.graphql:/dist/supergraph.graphql:ro
      - ../../infra/router/router.local.yaml:/dist/router.yaml:ro
    command: ["--supergraph", "/dist/supergraph.graphql", "--config", "/dist/router.yaml"]
    environment:
      - APOLLO_ROUTER_LISTEN_ADDRESS=0.0.0.0:4000
      - APOLLO_ROUTER_TELEMETRY_METRICS_PROMETHEUS_ENABLED=true
      - APOLLO_ROUTER_TELEMETRY_METRICS_PROMETHEUS_LISTEN=0.0.0.0:9090
      - APOLLO_ROUTER_TELEMETRY_METRICS_PROMETHEUS_PATH=/metrics
    profiles:
      - gateway

  # -------------------------------------------------------------
  # Observability Stack
  # Profile: observability
  # -------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: neotool-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.1.4
    container_name: neotool-grafana
    env_file: ../.env.local
    ports:
      - "3001:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    profiles:
      - observability

  # PostgreSQL Exporter - monitors database metrics via pgbouncer
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: neotool-postgres-exporter
    env_file: ../.env.local
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-neotool}:${POSTGRES_PASSWORD:-neotool}@pgbouncer:6432/${POSTGRES_DB:-neotool_db}?sslmode=disable"
    ports:
      - "9187:9187"
    profiles:
      - observability

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:2.9.0
    container_name: neotool-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    depends_on:
      - prometheus
    profiles:
      - observability

  # Promtail - Log collection agent
  promtail:
    image: grafana/promtail:2.9.0
    container_name: neotool-promtail
    volumes:
      - ../observability/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - observability
      
volumes:
  pgdata:
  loki-data:
  grafana-data:
  kafka-data:
  prefect-data:

networks:
  postgres-internal:
    driver: bridge
    internal: false  # Set to true if you want complete isolation (no internet access)

