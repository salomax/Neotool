micronaut:
  application:
    name: neotool-assistant
  executors:
    blocking:
      virtual: true
  server:
    port: 8082
    thread-selection: blocking
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3000
            - http://127.0.0.1:3000
          allowed-methods:
            - GET
            - POST
            - OPTIONS
          allowed-headers:
            - "*"
          allow-credentials: true
          max-age: 3600
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT15S
  observation:
    enabled: true

# OpenTelemetry: keep propagation enabled, disable exporting by default for local development.
# Production should set OTEL_TRACES_EXPORTER=otlp and OTEL_EXPORTER_OTLP_ENDPOINT.
otel:
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  propagators: tracecontext,baggage

# LLM Configuration
llm:
  provider: ${LLM_PROVIDER:gemini}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    generate-content-path: ${GEMINI_GENERATE_CONTENT_PATH:/v1beta/models/__MODEL__:generateContent}
    request-timeout-ms: ${GEMINI_REQUEST_TIMEOUT_MS:60000}
    user-agent: ${GEMINI_USER_AGENT:neotool-assistant/1.0}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    temperature: ${GEMINI_TEMPERATURE:0.7}
    max-tokens: ${GEMINI_MAX_TOKENS:2048}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key-ref: ${OPENAI_API_KEY_REF:OPENAI_API_KEY}
    chat-completions-path: ${OPENAI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
    request-timeout-ms: ${OPENAI_REQUEST_TIMEOUT_MS:60000}
    user-agent: ${OPENAI_USER_AGENT:neotool-assistant/1.0}
  retry:
    max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:4}
    initial-delay: ${LLM_RETRY_INITIAL_DELAY_MS:250}
    max-delay: ${LLM_RETRY_MAX_DELAY_MS:2000}
    multiplier: ${LLM_RETRY_MULTIPLIER:2.0}
    retryable-errors:
      - RATE_LIMIT
      - TIMEOUT
      - SERVER_ERROR
  circuit-breaker:
    failure-threshold: ${LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    failure-window-ms: ${LLM_CIRCUIT_BREAKER_FAILURE_WINDOW_MS:60000}
    timeout-ms: ${LLM_CIRCUIT_BREAKER_TIMEOUT_MS:60000}
    half-open-requests: ${LLM_CIRCUIT_BREAKER_HALF_OPEN_REQUESTS:1}
    success-threshold: ${LLM_CIRCUIT_BREAKER_SUCCESS_THRESHOLD:2}

# GraphQL Client Configuration
graphql:
  endpoint: ${GRAPHQL_ENDPOINT:}
  timeout-seconds: ${GRAPHQL_TIMEOUT:30}

# JWT Configuration (Validator Only)
jwt:
  # Algorithm: RS256 (RSA-SHA256) - only supported algorithm
  # Can be set via JWT_ALGORITHM environment variable
  algorithm: ${JWT_ALGORITHM:RS256}
  # RSA public key path (PEM format) - for RS256 validation
  # Can be set via JWT_PUBLIC_KEY_PATH environment variable
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  # Inline RSA public key (PEM or base64) - alternative to public-key-path
  # Can be set via JWT_PUBLIC_KEY environment variable
  public-key: ${JWT_PUBLIC_KEY:}
  # Key ID for multi-key support (default: kid-1)
  # Can be set via JWT_KEY_ID environment variable
  key-id: ${JWT_KEY_ID:kid-1}
  # JWKS URL for fetching public keys (for future JWKS integration)
  # Can be set via JWT_JWKS_URL environment variable
  # Example: http://security-service:8080/.well-known/jwks.json
  jwks-url: ${JWT_JWKS_URL:}

# Vault Configuration
vault:
  # Enable Vault integration (default: false for development)
  # Can be set via VAULT_ENABLED environment variable
  enabled: ${VAULT_ENABLED:false}
  # Vault server address
  # Can be set via VAULT_ADDRESS environment variable
  address: ${VAULT_ADDRESS:http://localhost:8200}
  # Vault authentication token (should be provided via environment variable in production)
  # Can be set via VAULT_TOKEN environment variable
  token: ${VAULT_TOKEN:}
  # Secret path prefix in Vault (keys stored at {secret-path}/{keyId}/private, {secret-path}/{keyId}/public)
  # Can be set via VAULT_SECRET_PATH environment variable
  secret-path: ${VAULT_SECRET_PATH:secret/jwt/keys}
  # KV secrets engine version (default: 2)
  # Can be set via VAULT_ENGINE_VERSION environment variable
  engine-version: ${VAULT_ENGINE_VERSION:2}
  # Connection timeout in milliseconds (default: 5000)
  # Can be set via VAULT_CONNECTION_TIMEOUT environment variable
  connection-timeout: ${VAULT_CONNECTION_TIMEOUT:5000}
  # Read timeout in milliseconds (default: 5000)
  # Can be set via VAULT_READ_TIMEOUT environment variable
  read-timeout: ${VAULT_READ_TIMEOUT:5000}

# Management Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
      path: /prometheus
      sensitive: false  # No authentication required

# Datasource (required for Flyway and future JPA entities)
datasources:
  default:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:6432}/${POSTGRES_DB:neotool_db}
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER:neotool}
    password: ${POSTGRES_PASSWORD:neotool}
    dialect: POSTGRES
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-test-query: "SELECT 1"
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      auto-commit: false

# JPA entities are used by completion and conversation flows.
jpa:
  default:
    enabled: ${JPA_DEFAULT_ENABLED:true}
    properties:
      hibernate:
        hbm2ddl:
          auto: none

# Flyway migrations (run after security schema exists on same DB)
flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true
      baseline-version: 0
      table: flyway_schema_history_assistant
      create-schemas: true
      schemas:
        - public
        - assistant

# Kafka - assistant worker mode for banking import reader flow.
# Keep disabled by default until rollout is explicitly enabled.
kafka:
  enabled: ${KAFKA_ENABLED:false}
  bootstrap:
    servers: ${KAFKA_BROKERS:}
  topics:
    pdf:
      banking-reader-requested: ${KAFKA_TOPIC_PDF_BANKING_READER_REQUESTED:assistant.banking-reader.requested}
      banking-reader-done: ${KAFKA_TOPIC_PDF_BANKING_READER_DONE:assistant.banking-pdf-reader.done}
      banking-reader-failed: ${KAFKA_TOPIC_PDF_BANKING_READER_FAILED:assistant.banking-pdf-reader.failed}
  consumers:
    banking-reader:
      group-id: ${KAFKA_PDF_BANKING_READER_GROUP_ID:assistant-banking-reader}
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  producers:
    default:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.micronaut.serde.kafka.KafkaSerdeSerializer

assistant:
  banking-reader:
    consumer:
      enabled: ${ASSISTANT_BANKING_READER_CONSUMER_ENABLED:true}
    prompt-selection:
      credit-card-bill-prompt-id: ${ASSISTANT_BANKING_READER_PROMPT_CREDIT_CARD_BILL_ID:}
      bank-statement-prompt-id: ${ASSISTANT_BANKING_READER_PROMPT_BANK_STATEMENT_ID:}
    # Probe listener used only to validate bootstrap subscription in BKL-008.
    # Keep disabled in normal runtime.
    bootstrap-consumer:
      enabled: ${ASSISTANT_BANKING_READER_BOOTSTRAP_CONSUMER_ENABLED:false}
