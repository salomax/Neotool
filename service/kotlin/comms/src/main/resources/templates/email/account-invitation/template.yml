key: account.invitation
channel: EMAIL
metadata:
  name: "Account Invitation"
  description: "Sent when an account owner or admin invites a user to an account"
  owner: "security-team"

variables:
  - name: inviterDisplayName
    type: STRING
    required: false
  - name: accountName
    type: STRING
    required: true
  - name: acceptLink
    type: URL
    required: true
  - name: expiryDays
    type: INTEGER
    required: true
  - name: role
    type: STRING
    required: true
  - name: supportEmail
    type: STRING
    required: false
    default: "suporte@invistus.com.br"
  - name: logoUrl
    type: URL
    required: false
    default: "https://invistus.com.br/images/logos/invistus-logo-white-transparent.png"

locales:
  en:
    subject: "You're invited to join {{accountName}} - Invistus"
    bodyPath: "body.en.html"
  pt:
    subject: "Você foi convidado(a) para {{accountName}} - Invistus"
    bodyPath: "body.pt.html"
  pt-BR:
    subject: "Você foi convidado(a) para {{accountName}} - Invistus"
    bodyPath: "body.pt-BR.html"

defaultLocale: pt

channelConfig:
  email:
    format: HTML
    inlineCss: true
    trackOpens: false
