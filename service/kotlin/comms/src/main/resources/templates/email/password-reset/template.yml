key: auth.password-reset
channel: EMAIL
metadata:
  name: "Password Reset Email"
  description: "Sent when user requests password reset"
  owner: "security-team"

variables:
  - name: resetUrl
    type: URL
    required: true
  - name: expiresInMinutes
    type: INTEGER
    required: false
    default: 60
  - name: supportEmail
    type: STRING
    required: false
    default: "suporte@invistus.com.br"
  - name: logoUrl
    type: URL
    required: false
    default: "https://invistus.com.br/images/logos/invistus-logo-white-transparent.png"

locales:
  en:
    subject: "Reset your Invistus password"
    bodyPath: "body.en.html"
  pt:
    subject: "Redefina sua senha da Invistus"
    bodyPath: "body.pt.html"
  pt-BR:
    subject: "Redefina sua senha da Invistus"
    bodyPath: "body.pt-BR.html"

defaultLocale: en

channelConfig:
  email:
    format: HTML
    inlineCss: true
    trackOpens: false
