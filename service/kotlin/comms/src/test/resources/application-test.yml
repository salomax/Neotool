micronaut:
  application:
    name: neotool-service-test
  server:
    # random port for testing
    port: 0
  security:
    enabled: false
  http:
    client:
      read-timeout: 30s
      connect-timeout: 10s
datasources:
  default:
    enabled: false
flyway:
  enabled: false
batch:
  consumer:
    max-retries: 3
    initial-retry-delay-ms: 1000
    max-retry-delay-ms: 10000
    retry-backoff-multiplier: 2.0
    commit-timeout-seconds: 5
    enable-dlq-fallback: true
    dlq-max-retries: 3
    shutdown-timeout-seconds: 5
kafka:
  enabled: false
redis:
  enabled: false
endpoints:
  enabled: false
  health:
    enabled: true
    details-visible: ANONYMOUS
    redis:
      enabled: false

neotool:
  tracing:
    jdbc:
      enabled: false

otel:
  sdk:
    disabled: true
  traces:
    exporter: none

logging:
  level:
    io.github.salomax.neotool: DEBUG
    io.micronaut.transaction: DEBUG
    io.micronaut.data.tx: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb.core: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: OFF
    org.apache.kafka: OFF
