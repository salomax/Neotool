micronaut:
  application:
    name: neotool-mcp-service-test
  server:
    # -1 = Micronaut picks a free port (do not use 0: clients can resolve localhost:0)
    port: -1
  http:
    client:
      read-timeout: 30s
      connect-timeout: 10s

otel:
  sdk:
    disabled: true
  traces:
    exporter: none

logging:
  level:
    io.github.salomax.neotool: DEBUG
    org.testcontainers: OFF
