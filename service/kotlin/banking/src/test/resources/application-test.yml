micronaut:
  application:
    name: neotool-banking-service-test
  server:
    # random port for testing
    port: 0
  security:
    enabled: false
  http:
    client:
      read-timeout: 30s
      connect-timeout: 10s

graphql:
  router:
    url: http://localhost:18092/graphql
datasources:
  default:
    enabled: false
flyway:
  enabled: false
kafka:
  enabled: false
  # When Kafka IT runs (Testcontainers), topics are created by KafkaTopicInitializer; names match main config.
  topics:
    import-file-requested: banking.import.file-requested
    import-file-requested-dlt: banking.import.file-requested.DLT
    import-job-completed: banking.import.job-completed
    pdf:
      extractor-submitted: pdf-extractor.submitted
      extractor-extracted: pdf-extractor.extracted
      extractor-dlq: pdf-extractor.dlq
      banking-reader-done: assistant.banking-pdf-reader.done
      banking-reader-failed: assistant.banking-pdf-reader.failed
      banking-reader-requested: assistant.banking-reader.requested
  consumers:
    import-status:
      group-id: banking-service-import-status
    pdf-status:
      group-id: banking-service-pdf-status
redis:
  enabled: false
# Assets service URL for import file storage IT (MockWebServer on 18092)
banking:
  assets-service:
    url: http://localhost:18092
    graphql-path: /graphql
  financialdata-service:
    url: http://localhost:18093
    target-audience: neotool-financial-data-service
    listed-prices-export-path: /internal/market-data/listed-prices/export
  market-data-sync:
    listed-prices:
      bulk-enabled: true
      batch-size: 2
      connect-timeout-seconds: 10
      read-timeout-seconds: 30
endpoints:
  enabled: false
  health:
    enabled: true
    details-visible: ANONYMOUS
    redis:
      enabled: false

neotool:
  tracing:
    jdbc:
      enabled: false

otel:
  sdk:
    disabled: true
  traces:
    exporter: none

logging:
  level:
    io.github.salomax.neotool: DEBUG
    io.micronaut.transaction: DEBUG
    io.micronaut.data.tx: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb.core: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: OFF
    org.apache.kafka: OFF
