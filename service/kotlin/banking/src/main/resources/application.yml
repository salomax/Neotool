micronaut:
  application:
    name: neotool-banking-service
  executors:
    blocking:
      virtual: true
  server:
    port: 8092
    # Use blocking I/O threads for request handling (required for JPA/Hibernate blocking operations)
    # Works with virtual threads (enabled above) to efficiently handle blocking database operations
    thread-selection: blocking
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3000
            - http://127.0.0.1:3000
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - "*"
          allow-credentials: true
          max-age: 3600
  # Micrometer Configuration for Metrics Collection
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT15S
  observation:
    enabled: true

datasources:
  default:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:6432}/${POSTGRES_DB:neotool_db}
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER:neotool}
    password: ${POSTGRES_PASSWORD:neotool}
    dialect: POSTGRES
    # HikariCP Connection Pool Configuration
    # See: https://github.com/brettwooldridge/HikariCP#configuration-knobs-baby
    hikari:
      # Pool sizing
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

      # Connection lifecycle
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000} # 30 seconds
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000} # 10 minutes
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000} # 30 minutes
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000} # 60 seconds (0 to disable)

      # Connection validation
      connection-test-query: "SELECT 1"
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000} # 5 seconds

      # Performance tuning
      auto-commit: false # Let transactions control commit
      read-only: false

      # PostgreSQL-specific optimizations
      data-source-properties:
        # Connection pool name for monitoring
        applicationName: ${micronaut.application.name:neotool-banking-service}
        # Connection parameters
        socketTimeout: 30
        loginTimeout: 10
        # Performance hints
        prepareThreshold: 0
        tcpKeepAlive: true

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true
      baseline-version: 0
      table: flyway_schema_history_banking
      schemas:
        - public
        - banking

graphql:
  enabled: true
  graphiql:
    enabled: true
    path: /graphiql
  # Apollo Router URL for service-to-service calls (e.g. assets upload).
  # Required when any outbound GraphQL call is used (logo hydration, etc).
  router:
    url: ${GRAPHQL_ROUTER_URL:http://localhost:4000/graphql}

# Service principal credentials (for outbound service-to-service calls via Apollo Router).
# Register via: neotool service register neotool-banking-service --permissions ... --output-env
security:
  service:
    url: ${SECURITY_SERVICE_URL:http://localhost:8080}
    id: ${SECURITY_SERVICE_ID:}
    secret: ${SECURITY_SERVICE_SECRET:}

# logo.dev integration — fetches institution logos by domain.
# Leave LOGO_DEV_TOKEN unset (or empty) to disable logo hydration entirely.
# Assets service — for import file storage (presigned upload/download).
# Set ASSETS_SERVICE_URL in deployment (e.g. http://assets-service or http://localhost:port).
banking:
  logodev:
    token: ${LOGO_DEV_TOKEN:}
  assets-service:
    url: ${ASSETS_SERVICE_URL:}
    graphql-path: /graphql
    import-namespace: ${ASSETS_IMPORT_NAMESPACE:transaction-imports}
    pdf-import-namespace: ${ASSETS_PDF_IMPORT_NAMESPACE:pdf-imports}
    pdf-download-ttl-seconds: ${ASSETS_PDF_DOWNLOAD_TTL_SECONDS:7200}

# Kafka — import file requested / job completed (set KAFKA_BROKERS in deployment).
# Use host:port format (example: localhost:9094), without http://
# Set kafka.enabled=true in dev/staging to auto-create topics at startup.
kafka:
  enabled: ${KAFKA_ENABLED:true}
  bootstrap:
    servers: ${KAFKA_BROKERS:}
  topics:
    import-file-requested: banking.import.file-requested
    import-file-requested-dlt: banking.import.file-requested.DLT
    import-job-completed: banking.import.job-completed
    pdf:
      extractor-submitted: ${KAFKA_TOPIC_PDF_EXTRACTOR_SUBMITTED:pdf-extractor.submitted}
      extractor-extracted: ${KAFKA_TOPIC_PDF_EXTRACTOR_EXTRACTED:pdf-extractor.extracted}
      extractor-dlq: ${KAFKA_TOPIC_PDF_EXTRACTOR_DLQ:pdf-extractor.dlq}
      banking-reader-done: ${KAFKA_TOPIC_PDF_BANKING_READER_DONE:assistant.banking-pdf-reader.done}
  consumers:
    import-file:
      group-id: banking-import-consumer
      max-poll-records: 1  # process one import at a time per partition
      enable-auto-commit: false
      auto-offset-reset: earliest
    pdf-status:
      group-id: ${KAFKA_PDF_STATUS_GROUP_ID:banking-service-pdf-status}
  producers:
    default:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.micronaut.serde.kafka.KafkaSerdeSerializer

# JWT Configuration (Validator Only)
jwt:
  # Algorithm: RS256 (RSA-SHA256) - only supported algorithm
  # Can be set via JWT_ALGORITHM environment variable
  algorithm: ${JWT_ALGORITHM:RS256}
  # Can be set via JWT_JWKS_URL environment variable
  # Example: http://security-service:8080/.well-known/jwks.json
  # When configured, the service will fetch public keys from the JWKS endpoint for JWT validation
  # Validating services do not need direct access to Vault
  jwks-url: ${JWT_JWKS_URL:}

# Management Endpoints Configuration
endpoints:
  all:
    enabled: true
  health:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false
  metrics:
    enabled: true
    sensitive: false
