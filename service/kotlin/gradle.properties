# KSP: disable incremental to avoid "Storage ... is already registered" (google/ksp#2057, #2072)
ksp.incremental=false

# Configuration Cache
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# KSP + Micronaut codegen need more metaspace than the 256m default; CI OOMs otherwise.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
