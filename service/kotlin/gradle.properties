# KSP: disable incremental to avoid "Storage ... is already registered" (google/ksp#2057, #2072)
ksp.incremental=false

# Configuration Cache
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
# Keep the Gradle daemon below the service runtime envelope used for local runs.
# The expensive part in repeated compile/test loops is usually aggregate daemon +
# worker + Kotlin daemon memory, so we cap each pool instead of allowing one
# large daemon plus unbounded parallel workers.
org.gradle.jvmargs=-Xms256m -Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xms256m,-Xmx1024m,-XX:MaxMetaspaceSize=384m
