name = "invistus-slack-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# KV para persistir sessões Goose ↔ threads Slack
[[kv_namespaces]]
binding = "SESSIONS"
id = "ad2e9df354f14ef883dce42bacf249d6"         # veja SETUP.md

[vars]
# Mapeamento canal Slack → hostname do DevPod (sem https://)
# Formato: "CHANNEL_ID:hostname,CHANNEL_ID:hostname"
# Exemplo: "C12345ABC:devpod-1.invistus.com.br,C67890DEF:devpod-2.invistus.com.br"
# Como obter o channel ID: abra o canal no Slack → botão direito → "Copy link"
# CHANNEL_DEVPOD_MAP = "SUBSTITUIR_CANAL_ID:devpod-1.invistus.com.br"

CHANNEL_DEVPOD_MAP = "C0BEEESR2DS:devpod-1.invistus.com.br"

# Secrets (NÃO colocar aqui — usar: wrangler secret put NOME)
# SLACK_BOT_TOKEN
# SLACK_SIGNING_SECRET
# GOOSE_SERVER_SECRET
