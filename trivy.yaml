# Trivy config — kept in sync with `neotool validate security` / CI security-scan.
#
# Local workspaces contain multi-GB install trees (node_modules, .pnpm-store,
# Gradle caches). CI never has them (clean checkout), and dependency CVEs are
# already detected via lockfiles (pnpm-lock.yaml, go.mod, etc.). Skipping these
# dirs keeps a local scan aligned with CI and under the default timeout.
timeout: 15m

scan:
  skip-dirs:
    - "**/.git"
    - "**/node_modules"
    - "**/.pnpm-store"
    - "**/.gradle"
    - "**/.gradle-home"
    - "**/.gradle-local"
    - "**/build"
    - "**/.next"
    - "**/.neotool"
    - "**/.nx"
    - "**/coverage"
    - "**/dist"
    - "**/out"
    - "**/.venv"
    - "**/venv"
    # Local agent/IDE config (gitignored). CI never sees these.
    - "**/.codex"
    - "**/.claude"
  # Local secret-bearing files that are gitignored. Must live under `scan`
  # (not `secret.skip-files` — that key is ignored by Trivy).
  skip-files:
    - "**/.env"
    - "**/.env.*"
    - "**/.mcp.json"
